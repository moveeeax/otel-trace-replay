name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.22.x", "1.23.x", "1.24.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      - name: Verify formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Build
        run: go build -o /tmp/otel-trace-replay .

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - name: Build
        run: go build -o /tmp/otel-trace-replay .
      - name: Dry-run the recorded example trace
        run: |
          out=$(/tmp/otel-trace-replay --file examples/trace.json --dry-run)
          echo "$out"
          echo "$out" | grep -q "loaded 3 span" || { echo "unexpected dry-run output"; exit 1; }
      - name: Emit a burst to a closed port and expect a clean export error
        run: |
          set +e
          /tmp/otel-trace-replay --file examples/trace.json --endpoint 127.0.0.1:59999 --scale 0
          code=$?
          set -e
          test "$code" -eq 1 || { echo "expected exit 1 on unreachable collector, got $code"; exit 1; }
